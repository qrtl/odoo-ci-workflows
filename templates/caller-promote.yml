# Copy this file to your project's `promotion` branch (an orphan holding only
# this caller; also put it on the default branch so the workflow is listed) at:
#   .github/workflows/promote.yml
#
# Promotes one aggregated commit that the copy database has rehearsed to the
# production host. PRODUCTION_SSH_KEY is a secret of the repo's `production`
# environment. A private repo's environment cannot require reviewers below the
# Enterprise plan, so three settings keep the key to the promoters: the
# environment's branch policy releases it only to runs from `promotion`,
# branch protection lets only promoters push that branch, and the `if` below
# lets only them dispatch or rerun. The two promoter lists must match. Keeping
# the caller off aggregate-config leaves that branch open to every developer.
# Always dispatch from `promotion` (`--ref promotion`, or "Use workflow from"
# in the Actions UI): both default to the default branch, whose copy the
# environment refuses.
# Replace all <PLACEHOLDER> values before use.

name: Promote to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The aggregated commit to deploy (full 40-hex id, as the staging run names it)
        required: true
      upgrade_databases:
        description: Every production database, space-separated
        required: true
        default: "<PRODUCTION_DATABASES>"
      dry_run:
        description: Stop after the backup and the preview; change nothing
        type: boolean
        default: false
      republish:
        description: Only publish the tag of a commit already deployed, whose run lost its tag step
        type: boolean
        default: false

jobs:
  promote:
    # triggering_actor: a rerun keeps the original dispatcher as github.actor.
    if: contains(fromJSON('["<PROMOTER_LOGIN>"]'), github.actor) && contains(fromJSON('["<PROMOTER_LOGIN>"]'), github.triggering_actor)
    uses: qrtl/odoo-ci-workflows/.github/workflows/deploy-production.yml@main
    with:
      production_host: "<PRODUCTION_HOST>"
      production_port: "<PRODUCTION_PORT>"
      production_user: <PRODUCTION_USER>
      host_name: <PROJECT>-prod
      staging_host: "<STAGING_HOST>"
      staging_port: "<STAGING_PORT>"
      staging_user: <STAGING_USER>
      sha: ${{ inputs.sha }}
      upgrade_databases: ${{ inputs.upgrade_databases }}
      # Must equal upgrade_i18n_overwrite in the staging host's restore.conf.
      i18n_overwrite: true
      dry_run: ${{ inputs.dry_run }}
      republish: ${{ inputs.republish }}
      # project_dir: /odoo/code/addons  # if the production checkout lives elsewhere
    secrets: inherit
    permissions:
      contents: write

name: Gitaggregate

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to repos.yml in the calling repo
        type: string
        default: repos.yml
      config_branch:
        description: Branch holding repos.yml; checked out whatever triggered the run, and merged PR lines are dropped from it.
        type: string
        default: aggregate-config
      target_branch:
        description: Branch to push materialized addons to
        type: string
        default: _git_aggregated
      commit_message:
        description: Commit message for the aggregated commit
        type: string
        default: update addons
      python_version:
        description: Python version for the runner
        type: string
        default: "3.11"
    outputs:
      changed:
        description: Whether a new snapshot was pushed
        value: ${{ jobs.aggregate.outputs.changed }}

concurrency:
  group: aggregate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    env:
      # Whether this repo may use the App's key; the key itself stays out of env.
      HAS_APP_KEY: ${{ secrets.AGG_APP_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.config_branch }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: qrtl/odoo-ci-workflows
          path: .ci-tools

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - run: pip install git-aggregator pyyaml

      # Reads the organization's private repos; skipped where the key is not shared.
      - name: Mint the qrtl-aggregate token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AGG_APP_ID }}
          private-key: ${{ secrets.AGG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Build addons and push to ${{ inputs.target_branch }}
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGG_APP_TOKEN: ${{ steps.app.outputs.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CONFIG_BRANCH: ${{ inputs.config_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: python .ci-tools/scripts/aggregate.py ${{ inputs.config_path }}

name: Deploy to staging

on:
  workflow_call:
    inputs:
      staging_host:
        description: Staging server IP or hostname
        type: string
        required: true
      staging_port:
        description: SSH port
        type: string
        default: "60897"
      staging_user:
        description: SSH user
        type: string
        default: quartile
      project_dir:
        description: Project directory on the staging server (e.g. /odoo/code)
        type: string
        required: true
      service_name:
        description: Docker container name to restart
        type: string
        default: odoo
      deploy_branch:
        description: Branch to deploy
        type: string
        default: _git_aggregated
      upgrade_databases:
        description: >
          Space-separated databases to upgrade after the code is deployed, with
          click-odoo-update. Empty (the default) keeps the previous behaviour:
          code is deployed and the service restarted, nothing is upgraded.
        type: string
        default: ""
      odoo_source_path:
        description: >
          Path to the Odoo source inside the container, exported as PYTHONPATH:
          Odoo is bind-mounted rather than pip-installed, so click-odoo cannot
          import it otherwise. The default is the standard layout; this exists
          for a host that deviates from it.
        type: string
        default: /odoo/code/odoo
    secrets:
      STAGING_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ inputs.staging_port }} ${{ inputs.staging_host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to staging
        # No caller value is ever placed on the ssh command line or interpolated
        # into the script. ssh joins the words of a remote command with spaces
        # and lets the remote shell re-split them, so local quoting does not
        # survive that boundary: `bash -s -- "a b" c` arrives as three words.
        # Instead the values are emitted as %q-quoted assignments and piped,
        # with the script, into the remote shell on stdin.
        env:
          STAGING_HOST: ${{ inputs.staging_host }}
          STAGING_PORT: ${{ inputs.staging_port }}
          STAGING_USER: ${{ inputs.staging_user }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          SERVICE_NAME: ${{ inputs.service_name }}
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
          UPGRADE_DATABASES: ${{ inputs.upgrade_databases }}
          ODOO_SOURCE_PATH: ${{ inputs.odoo_source_path }}
        run: |
          {
            printf 'project_dir=%q\n'       "$PROJECT_DIR"
            printf 'service_name=%q\n'      "$SERVICE_NAME"
            printf 'deploy_branch=%q\n'     "$DEPLOY_BRANCH"
            printf 'upgrade_databases=%q\n' "$UPGRADE_DATABASES"
            printf 'odoo_source_path=%q\n'  "$ODOO_SOURCE_PATH"
            cat <<'REMOTE'
          set -e

          LOCKFILE="/tmp/deploy-$service_name.lock"
          exec 200>"$LOCKFILE"
          flock -n 200 || { echo "Deploy already in progress"; exit 1; }

          cd "$project_dir"
          sudo -u odoo git fetch origin "$deploy_branch"
          sudo -u odoo git reset --hard "origin/$deploy_branch"
          docker restart "$service_name"

          # read -ra splits on whitespace without globbing, so a database name is
          # only ever a database name. An empty value yields an empty array and
          # the loop does not run, which is the default.
          read -ra databases <<<"$upgrade_databases"
          for db in "${databases[@]}"; do
            echo "== $db: upgrading the addons whose files changed"
            # Failure is the exit status, not the log text: a successful run
            # prints an ERROR line about the logfile directory while falling
            # back to stdout, which is what it is being asked to do.
            docker exec -e PYTHONPATH="$odoo_source_path" \
              -u odoo "$service_name" \
              click-odoo-update -d "$db" --ignore-core-addons \
                --watcher-max-seconds 30 --logfile=/dev/stdout
          done
          echo "Deploy complete"
          REMOTE
          } | ssh -i ~/.ssh/deploy_key \
                -p "$STAGING_PORT" \
                -o StrictHostKeyChecking=accept-new \
                "$STAGING_USER@$STAGING_HOST" bash -s

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

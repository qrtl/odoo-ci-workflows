name: Deploy to staging

on:
  workflow_call:
    inputs:
      staging_host:
        description: Staging server IP or hostname
        type: string
        required: true
      staging_port:
        description: SSH port
        type: string
        default: "60897"
      staging_user:
        description: SSH user
        type: string
        default: quartile
      project_dir:
        description: Project directory on the staging server (e.g. /odoo/code)
        type: string
        required: true
      service_name:
        description: Docker container name to restart
        type: string
        default: odoo
      deploy_branch:
        description: Branch to deploy
        type: string
        default: _git_aggregated
      upgrade_databases:
        description: >
          Space-separated databases to upgrade after the code is deployed, with
          click-odoo-update. Empty (the default) keeps the previous behaviour:
          code is deployed and the service restarted, nothing is upgraded.
        type: string
        default: ""
      odoo_source_path:
        description: >
          Path to the Odoo source inside the container, exported as PYTHONPATH:
          Odoo is bind-mounted rather than pip-installed, so click-odoo cannot
          import it otherwise. The default is the standard layout; this exists
          for a host that deviates from it.
        type: string
        default: /odoo/code/odoo
    secrets:
      STAGING_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ inputs.staging_port }} ${{ inputs.staging_host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ inputs.staging_port }} \
            -o StrictHostKeyChecking=accept-new \
            ${{ inputs.staging_user }}@${{ inputs.staging_host }} '
            set -e
            LOCKFILE="/tmp/deploy-${{ inputs.service_name }}.lock"
            exec 200>"$LOCKFILE"
            flock -n 200 || { echo "Deploy already in progress"; exit 1; }
            cd ${{ inputs.project_dir }}
            sudo -u odoo git fetch origin ${{ inputs.deploy_branch }}
            sudo -u odoo git reset --hard origin/${{ inputs.deploy_branch }}
            docker restart ${{ inputs.service_name }}
            # Unquoted on purpose: the word splitting is what turns the input
            # into one iteration per database.
            for db in ${{ inputs.upgrade_databases }}; do
              echo "== $db: upgrading the addons whose files changed"
              # Failure is the exit status, not the log text: a successful run
              # prints an ERROR line about the logfile directory while falling
              # back to stdout, which is exactly what it is being asked to do.
              # Apostrophes are forbidden in here - the whole remote command is
              # one single-quoted argument, and one would end it early.
              docker exec -e PYTHONPATH="${{ inputs.odoo_source_path }}" \
                -u odoo "${{ inputs.service_name }}" \
                click-odoo-update -d "$db" --ignore-core-addons \
                  --watcher-max-seconds 30 --logfile=/dev/stdout
            done
            echo "Deploy complete"
          '

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

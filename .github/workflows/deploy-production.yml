name: Promote to production

# Deploys one aggregated commit, by default the release snapshot, behind the
# caller's `production` environment, whose caller limits who may dispatch. The
# gate job resolves the request and refuses a candidate built with PRs under
# test; the deploy job previews, resets the checkout to the exact commit,
# upgrades every database in a one-off container while Odoo keeps serving,
# restarts Odoo and records the deploy as a `prod/<host>/<time>` tag. Rehearse
# first (rehearse-staging.yml) and read its summary: this workflow does not.
# See odoo-ansible plans/production-deploy-promotion.md.

on:
  workflow_call:
    inputs:
      production_host:
        type: string
        required: true
      production_port:
        type: string
        default: "60897"
      production_user:
        type: string
        default: quartile
      host_name:
        description: Short host name used in the tag (prod/<host_name>/<time>), e.g. qrtl-prod.
        type: string
        required: true
      sha:
        description: The aggregated commit to deploy. A commit, never a branch. Empty means the head of release_branch.
        type: string
        default: ""
      release_branch:
        description: The branch the aggregate pushes the release snapshot (no refs/pull lines) to.
        type: string
        default: _git_aggregated_release
      upgrade_databases:
        description: Space-separated production databases. Empty means the ones the last deploy upgraded.
        type: string
        default: ""
      i18n_overwrite:
        description: Pass --i18n-overwrite to the upgrade, as the staging deploy does.
        type: boolean
        default: true
      dry_run:
        description: Stop after the preview; change nothing.
        type: boolean
        default: false
      republish:
        description: Only publish the tag of a commit already deployed here, whose run lost its tag step. Nothing is deployed.
        type: boolean
        default: false
      environment:
        type: string
        default: production
      project_dir:
        type: string
        default: /odoo/code/addons
      service_name:
        type: string
        default: odoo
      odoo_source_path:
        type: string
        default: /odoo/code/odoo
      http_port:
        type: string
        default: "8069"
    secrets:
      # Not required here: the key lives on the caller's `production`
      # environment, which only the deploy job enters. A required secret is
      # checked at call time, before any environment, and fails the whole run.
      PRODUCTION_SSH_KEY:
        required: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.req.outputs.sha }}
      dbs: ${{ steps.req.outputs.dbs }}
      last_sha: ${{ steps.req.outputs.last_sha }}
    steps:
      # The latest successful deploy, from its annotated tag: the rollback
      # target, and what the host must still be at.
      - name: Read the latest deploy record
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ inputs.host_name }}
        run: |
          last=$(gh api --paginate "repos/${{ github.repository }}/git/matching-refs/tags/prod/$HOST/" --jq '.[].object.sha' | tail -n 1)
          if [ -n "$last" ]; then
            gh api "repos/${{ github.repository }}/git/tags/$last" --jq '.message' > last_deploy.json
          else
            echo '{}' > last_deploy.json
          fi
      - name: Read the release snapshot
        if: inputs.sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/branches/${{ inputs.release_branch }}" --jq .commit.sha > release.sha \
            || { echo "no ${{ inputs.release_branch }} branch: run the aggregate once, it pushes it" >&2; exit 1; }
      # Values reach the host's shell: full commit ids and plain database names only.
      - name: Resolve the request
        id: req
        env:
          SHA: ${{ inputs.sha }}
          DBS: ${{ inputs.upgrade_databases }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          last = json.load(open("last_deploy.json"))
          sha = os.environ["SHA"].strip()
          if not sha:
              if os.environ["REPUBLISH"] == "true": sys.exit("republish needs the sha of the deploy to republish")
              sha = open("release.sha").read().strip()
              if sha == last.get("sha"): sys.exit(f"the release snapshot {sha} is already deployed: nothing to promote")
          if not re.fullmatch(r"[0-9a-f]{40}", sha): sys.exit(f"sha must be a full commit id, got {sha!r}")
          dbs = " ".join(os.environ["DBS"].split()) or last.get("databases", "")
          if not dbs or "auto" in dbs.split(): sys.exit("upgrade_databases must name every production database; auto is refused")
          if not re.fullmatch(r"[\w-]+( [\w-]+)*", dbs): sys.exit("upgrade_databases must be plain names separated by single spaces")
          # The checkout is shared: a database left out would run new code on its old schema.
          if last and not set(dbs.split()) >= set(last["databases"].split()):
              sys.exit(f"upgrade_databases drops some of the last deploy's ({last['databases']}): name every database")
          for k, v in (("sha", sha), ("dbs", dbs), ("last_sha", last.get("sha", ""))):
              if re.search(r"[\x00-\x1f\x7f]", v): sys.exit(f"{k} contains control characters")
              print(f"{k}={v}")
          PY
      # Only a release snapshot, or the last deploy (a rollback), may reach the
      # host: any other commit with a benign repos.yml, aggregate-config's for
      # one, would be reset onto production as it is.
      - name: Refuse a commit that is not a release snapshot
        if: steps.req.outputs.sha != steps.req.outputs.last_sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.req.outputs.sha }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/${{ inputs.release_branch }}...$SHA" --jq .status 2>/dev/null || echo unknown)
          case "$status" in identical|behind) ;; *) echo "$SHA is not on ${{ inputs.release_branch }} ($status): promote a release snapshot" >&2; exit 1;; esac
      - name: Refuse a candidate built with PRs under test
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.req.outputs.sha }}
        run: |
          gh api "repos/${{ github.repository }}/contents/repos.yml?ref=$SHA" --jq .content 2>/dev/null | base64 -d > recipe.yml \
            || { echo "commit $SHA carries no repos.yml: aggregate again so the snapshot records its recipe" >&2; exit 1; }
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
          python3 - <<'PY'
          import sys, yaml
          # The parsed values, not the text: a YAML escape could spell refs/pull past a grep.
          for name, r in (yaml.safe_load(open("recipe.yml")) or {}).items():
              for v in [r.get("target"), *(r.get("merges") or [])]:
                  if "refs/pull/" in str(v): sys.exit(f"the candidate was built with a refs/pull merge ({name}: {v}): merge or drop it and aggregate again")
          PY
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          [ -n "$KEY" ] || { echo "::error::PRODUCTION_SSH_KEY is not set on the $ENV_NAME environment"; exit 1; }
          printf '%s\n' "$KEY" > .prod_key && chmod 600 .prod_key

      # Values reach the remote shell as %q-quoted assignments on stdin, never on
      # the ssh command line (see deploy-staging.yml for why).
      - name: Promote
        id: promote
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          DBS: ${{ needs.gate.outputs.dbs }}
          I18N: ${{ inputs.i18n_overwrite }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPUBLISH: ${{ inputs.republish }}
          LAST_SHA: ${{ needs.gate.outputs.last_sha }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          SERVICE: ${{ inputs.service_name }}
          SRC: ${{ inputs.odoo_source_path }}
          HTTP_PORT: ${{ inputs.http_port }}
        run: |
          # The default shell has no pipefail: without it the step takes tee's
          # status, and a failed promotion would show green.
          set -o pipefail
          {
            for v in SHA DBS I18N DRY_RUN REPUBLISH LAST_SHA PROJECT_DIR SERVICE SRC HTTP_PORT; do
              printf '%s=%q\n' "$v" "${!v}"
            done
            cat <<'REMOTE'
          set -euo pipefail
          # 1. One lock per host, shared with backup.sh, restore.sh and the container play.
          LOCKFILE=/odoo/host.lock
          [ -e "$LOCKFILE" ] || sudo -n install -m 0644 -o root -g root /dev/null "$LOCKFILE"
          exec 200<"$LOCKFILE"
          flock -w 1800 200 || { echo "host lock held for 30 minutes; giving up" >&2; exit 1; }

          # 2. Under the lock: production is still at the deploy the gate judged
          #    against (another promotion may have landed while this one waited
          #    for the lock), and the candidate is fetchable. Fetching changes
          #    nothing checked out.
          host_last=$(sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p' /odoo/last_deploy.json 2>/dev/null || true)
          current=$(sudo -n -u odoo git -C "$PROJECT_DIR" rev-parse HEAD)
          pending=$(cat /odoo/promotion.pending 2>/dev/null || true)   # step 5's "<sha>", then "<sha> upgrading"
          p_sha=${pending%% *}
          # Deployed here in full but its tag never landed: republish the record. A
          # marker older than the record is one the run did not live to remove.
          if [ "$host_last" = "$SHA" ] && [ "$current" = "$SHA" ] && { [ -z "$pending" ] || [ /odoo/last_deploy.json -nt /odoo/promotion.pending ]; }; then
            sudo -n rm -f /odoo/promotion.pending
            echo "== $SHA is already deployed here; republishing its record"
            [ "$DRY_RUN" = true ] || echo "DEPLOY_RECORD=$(cat /odoo/last_deploy.json)"
            exit 0
          fi
          [ "$REPUBLISH" != true ] || { echo "republish refused: $SHA is not deployed here in full (last deploy ${host_last:-none}, checkout at $current${pending:+, promotion of $p_sha pending})" >&2; exit 1; }
          [ "$host_last" = "$LAST_SHA" ] || { echo "the host's last deploy is ${host_last:-none}, the gate saw ${LAST_SHA:-none}: production moved while this run waited, or that deploy's tag was never created (promote ${host_last:-it} again to create it)" >&2; exit 1; }
          # A marker means a promotion was interrupted: retry it, or roll back the
          # code if no database upgrade had begun. Once one had, finish it: rolling
          # back past a partial upgrade means restoring a backup first.
          if [ -n "$p_sha" ] && [ "$p_sha" != "$SHA" ]; then
            if [ "$SHA" = "$LAST_SHA" ] && [ "$pending" = "$p_sha" ]; then
              echo "== rolling back the interrupted promotion of $p_sha; no database upgrade had begun"
            elif [ "$SHA" = "$LAST_SHA" ]; then
              echo "the interrupted promotion of $p_sha had begun upgrading databases: promote it again, or restore the latest backup (restore_production.sh) before rolling back" >&2; exit 1
            else
              echo "a promotion of $p_sha was interrupted: promote it again${LAST_SHA:+, or roll back to $LAST_SHA}" >&2; exit 1
            fi
          fi
          image_id=$(docker inspect --format '{{.Image}}' "$SERVICE")
          sudo -n -u odoo git -C "$PROJECT_DIR" fetch -q origin "$SHA"
          # Odoo must load the checkout this run resets. A host still on per-repo
          # clones would upgrade and restart on its old code while the record
          # claims $SHA (qrtl-prod, 2026-09-28), and a clone left in the path
          # shadows the checkout (Odoo takes a module from the first path that has
          # it). Read through the service's mounts, from a one-off container so a
          # stopped service can still be fixed; directories as aggregate.py derives them.
          check=$(cat <<'PY'
          import configparser, os, sys, yaml
          proj = sys.argv[1]
          dirs = [k.replace("./", "") for k in (yaml.safe_load(sys.stdin) or {})]
          c = configparser.ConfigParser(interpolation=None)
          c.read("/odoo/etc/odoo.conf")
          loaded = [p.strip().rstrip("/") for p in c["options"]["addons_path"].split(",") if p.strip()]
          missing = [f"{proj}/{d}" for d in dirs if f"{proj}/{d}" not in loaded]
          legacy = [f"{os.path.dirname(proj)}/{d}" for d in dirs if f"{os.path.dirname(proj)}/{d}" in loaded]
          if not dirs or missing or legacy:
              sys.exit(f"addons_path is {' '.join(loaded)}:" + (" no directories in repos.yml;" if not dirs else "")
                       + (f" missing {' '.join(missing)};" if missing else "") + (f" still loads {' '.join(legacy)};" if legacy else "")
                       + f" cut the host over to {proj} first (odoo-ansible playbooks/production-code-cutover.yml)")
          PY
          )
          sudo -n -u odoo git -C "$PROJECT_DIR" show "$SHA:repos.yml" \
            | docker run --rm -i --volumes-from "$SERVICE" --entrypoint python3 "$image_id" -c "$check" "$PROJECT_DIR"
          # A checkout at neither the last deploy nor the candidate was moved by hand:
          # only a rollback, or a retry of that very commit, may proceed from here.
          if [ -n "$LAST_SHA" ] && [ "$SHA" != "$LAST_SHA" ] && [ "$current" != "$LAST_SHA" ] && [ "$current" != "$SHA" ]; then
            echo "checkout is at $current, neither the last deploy $LAST_SHA nor $SHA: roll back to $LAST_SHA first" >&2; exit 1
          fi
          echo "== production at $current, promoting $SHA"

          # 3. Migration scripts rewrite data that users keep writing during a live
          #    upgrade; such a change goes to production by hand, in a window.
          if [ "$SHA" != "$LAST_SHA" ]; then
            mig=$(sudo -n -u odoo git -C "$PROJECT_DIR" diff --name-only "$current" "$SHA" | grep -E '(^|/)(migrations|upgrades)/' || true)
            [ -z "$mig" ] || { printf '%s\n' "$mig" >&2; echo "the change carries migration scripts (above): deploy it by hand in a maintenance window" >&2; exit 1; }
          fi

          # 4. Preview: the module directories the diff touches.
          echo "== module directories changed:"
          sudo -n -u odoo git -C "$PROJECT_DIR" diff --name-only "$current" "$SHA" | awk -F/ 'NF>2 {print $1"/"$2}' | sort -u
          if [ "$DRY_RUN" = true ]; then echo "== dry run: stopping before any change"; exit 0; fi

          # 5. Reset under the running service: its Python is loaded at start, so it
          #    keeps running the old code; only files read per request (static
          #    assets) come from the new tree before the restart.
          echo "== reset"
          # What the service runs: the last deploy, unless it (re)started after an
          # interrupted run of $SHA marked its restart.
          started=$(date -d "$(docker inspect --format '{{.State.StartedAt}}' "$SERVICE")" +%s)
          [ "$pending" = "$SHA restarting" ] && [ "$started" -ge "$(stat -c %Y /odoo/promotion.pending)" ] && running=$SHA || running=${LAST_SHA:-$current}
          printf '%s\n' "$SHA" | sudo -n tee /odoo/promotion.pending >/dev/null
          sudo -n -u odoo git -C "$PROJECT_DIR" reset -q --hard "$SHA"

          # 6. Upgrade every database in a one-off container from the same image and
          #    volumes. Until the restart, requests run the old code against the
          #    updated fields and records and some may fail: the accepted price of
          #    restart-only downtime. Step 3 only keeps data-rewriting changes out.
          printf '%s upgrading\n' "$SHA" | sudo -n tee /odoo/promotion.pending >/dev/null
          args=(--ignore-core-addons --watcher-max-seconds 30 --logfile=/dev/stdout)
          [ "$I18N" = true ] && args+=(--i18n-overwrite)
          for db in $DBS; do
            echo "== upgrading $db"
            # --entrypoint: the image's entrypoint runs odoo-bin with whatever
            # follows the image name, so click-odoo-update would reach odoo-bin
            # as arguments. (restore.sh uses docker exec, which bypasses it.)
            docker run --rm --volumes-from "$SERVICE" -e PYTHONPATH="$SRC" -u odoo \
              --entrypoint click-odoo-update "$image_id" \
              -c /odoo/etc/odoo.conf -d "$db" "${args[@]}" \
              || { sudo -n -u odoo git -C "$PROJECT_DIR" reset -q --hard "$running"; echo "upgrading $db failed: checkout put back to $running, the code the service still runs; promote again once fixed" >&2; exit 1; }
          done

          # 7. Restart, the only downtime, and wait for Odoo to listen (the
          #    odoo_container role's check).
          printf '%s restarting\n' "$SHA" | sudo -n tee /odoo/promotion.pending >/dev/null
          docker restart "$SERVICE"
          for i in $(seq 1 90); do
            (exec 3<>"/dev/tcp/127.0.0.1/$HTTP_PORT") 2>/dev/null && break
            [ "$i" -eq 90 ] && { echo "Odoo did not listen on $HTTP_PORT within 180s" >&2; exit 1; }
            sleep 2
          done

          # 8. Deploy record, on the host and (via the runner) as a tag. The timestamp
          #    is this host's clock in backup.sh's format, so the gate can compare it
          #    with backup names.
          ts=$(date +%Y_%m_%d_%H_%M_%S)
          record=$(printf '{"sha":"%s","image":"%s","image_id":"%s","databases":"%s","timestamp":"%s"}' \
            "$SHA" "$(docker inspect --format '{{.Config.Image}}' "$SERVICE")" "$image_id" "$DBS" "$ts")
          printf '%s\n' "$record" | sudo -n tee /odoo/last_deploy.json.tmp >/dev/null
          sudo -n mv -f /odoo/last_deploy.json.tmp /odoo/last_deploy.json   # atomic: a failed write keeps the previous record
          sudo -n rm -f /odoo/promotion.pending
          echo "DEPLOY_RECORD=$record"
          echo "== deployed $SHA"
          REMOTE
          } | ssh -i .prod_key -p "${{ inputs.production_port }}" -o StrictHostKeyChecking=accept-new \
                "${{ inputs.production_user }}@${{ inputs.production_host }}" bash -s | tee deploy.log
          grep -o '^DEPLOY_RECORD=.*' deploy.log | sed 's/^DEPLOY_RECORD=/record=/' >> "$GITHUB_OUTPUT" || true

      - name: Tag the deploy
        if: steps.promote.outputs.record != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ steps.promote.outputs.record }}
          HOST: ${{ inputs.host_name }}
          SHA: ${{ needs.gate.outputs.sha }}
          DBS: ${{ needs.gate.outputs.dbs }}
        run: |
          ts=$(python3 -c 'import json,os;print(json.loads(os.environ["RECORD"])["timestamp"])')
          tag="prod/$HOST/$ts"
          obj=$(gh api "repos/${{ github.repository }}/git/tags" -f tag="$tag" -f message="$RECORD" -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$obj" >/dev/null \
            || gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha="$obj" >/dev/null
          { echo "## Promoted to $HOST"; echo; echo "- commit \`$SHA\`"; echo "- databases \`$DBS\`"; echo "- tag \`$tag\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: inputs.dry_run
        env:
          HOST: ${{ inputs.host_name }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          { echo "## Dry run against $HOST"; echo; echo "Gate passed for \`$SHA\`. Preview printed, nothing changed."; echo; echo '```'; sed -n '/^== module directories/,/^== dry run/p' deploy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f .prod_key

name: Promote to production

# Deploys one aggregated commit that the copy database has rehearsed, behind
# the caller's `production` environment. The gate job checks the rehearsal
# record against the request and the candidate's recipe; the deploy job, once
# approved, takes a pre-update backup, previews, stops Odoo, resets the checkout
# to the exact commit, upgrades every database in a one-off container, starts
# Odoo and records the deploy as a `prod/<host>/<time>` tag.
# See odoo-ansible plans/production-deploy-promotion.md.

on:
  workflow_call:
    inputs:
      production_host:
        type: string
        required: true
      production_port:
        type: string
        default: "60897"
      production_user:
        type: string
        default: quartile
      host_name:
        description: Short host name used in the tag (prod/<host_name>/<time>), e.g. qrtl-prod.
        type: string
        required: true
      staging_host:
        description: Where the rehearsal record is read from.
        type: string
        required: true
      staging_port:
        type: string
        default: "60897"
      staging_user:
        type: string
        default: quartile
      sha:
        description: The aggregated commit to deploy. A commit, never a branch.
        type: string
        required: true
      upgrade_databases:
        description: Space-separated production databases; must be every database the rehearsal restored.
        type: string
        required: true
      i18n_overwrite:
        description: Must equal the flag the rehearsal ran with.
        type: boolean
        default: true
      dry_run:
        description: Stop after the backup and the preview; change nothing.
        type: boolean
        default: false
      environment:
        type: string
        default: production
      project_dir:
        type: string
        default: /odoo/code/addons
      service_name:
        type: string
        default: odoo
      odoo_source_path:
        type: string
        default: /odoo/code/odoo
      restore_dir:
        type: string
        default: /opt/odoo_restore
      backup_script:
        type: string
        default: /opt/odoo_backup/backup.sh
      http_port:
        type: string
        default: "8069"
    secrets:
      STAGING_SSH_KEY:
        required: true
      PRODUCTION_SSH_KEY:
        required: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      expected_image_id: ${{ steps.check.outputs.expected_image_id }}
      modules: ${{ steps.check.outputs.modules }}
      rollback: ${{ steps.check.outputs.rollback }}
    steps:
      - name: Read the rehearsal record from staging
        run: |
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > .staging_key && chmod 600 .staging_key
          ssh -i .staging_key -p "${{ inputs.staging_port }}" -o StrictHostKeyChecking=accept-new \
            "${{ inputs.staging_user }}@${{ inputs.staging_host }}" \
            "cat ${{ inputs.restore_dir }}/last_rehearsal.json" > record.json
          rm -f .staging_key

      # The latest successful deploy, from its annotated tag: the rollback target,
      # and the baseline a forward rehearsal's backup must postdate.
      - name: Read the latest deploy record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/prod/${{ inputs.host_name }}/" --jq '.[-1].object.sha // empty')
          if [ -n "$last" ]; then
            gh api "repos/${{ github.repository }}/git/tags/$last" --jq '.message' > last_deploy.json
          else
            echo '{}' > last_deploy.json
          fi

      - name: Read the candidate's recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/repos.yml?ref=${{ inputs.sha }}" --jq .content 2>/dev/null | base64 -d > recipe.yml \
            || { echo "commit ${{ inputs.sha }} carries no repos.yml: aggregate again so the snapshot records its recipe" >&2; exit 1; }

      - name: Check the request against the record
        id: check
        env:
          SHA: ${{ inputs.sha }}
          DBS: ${{ inputs.upgrade_databases }}
          I18N: ${{ inputs.i18n_overwrite }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          sha, dbs, i18n = os.environ["SHA"], set(os.environ["DBS"].split()), os.environ["I18N"] == "true"
          if not re.fullmatch(r"[0-9a-f]{40}", sha): sys.exit(f"sha must be a full commit id, got {sha!r}")
          if not dbs or "auto" in dbs: sys.exit("upgrade_databases must name every production database; auto is refused")
          if re.search(r"^\s*-\s*\S+\s+refs/pull/", open("recipe.yml").read(), re.M):
              sys.exit("the candidate was built with an uncommented refs/pull line: merge or drop it and aggregate again")
          rec, last = json.load(open("record.json")), json.load(open("last_deploy.json"))
          def out(k, v): print(f"{k}={v}")
          if last and sha == last.get("sha"):
              out("rollback", "true"); out("expected_image_id", last["image_id"]); out("modules", "(rollback to the previous deploy)")
              sys.exit(0)
          fail = []
          if rec.get("commit") != sha: fail.append(f"last rehearsal was of {rec.get('commit')}, not {sha}: run Rehearse first")
          if rec.get("result") != "ok": fail.append(f"last rehearsal failed (exit {rec.get('exit_code')})")
          m = re.search(r"(\d{4}_\d{2}_\d{2}_\d{2}_\d{2}_\d{2})", rec.get("backup") or "")
          if last and m and m.group(1) <= last.get("timestamp", ""):
              fail.append(f"rehearsal backup {m.group(1)} predates the current deploy {last['timestamp']}: wait for the next backup, then Rehearse")
          rehearsed = {d["source"] for d in rec.get("databases", [])}
          if rehearsed != dbs: fail.append(f"rehearsed databases {sorted(rehearsed)} != requested {sorted(dbs)}: promote every database, not a subset")
          if rec.get("i18n_overwrite") != i18n: fail.append(f"rehearsal ran with i18n_overwrite={rec.get('i18n_overwrite')}, request says {i18n}")
          if fail: sys.exit("\n".join(fail))
          mods = sorted({m for d in rec["databases"] for m in d["modules_upgraded"]})
          out("rollback", "false"); out("expected_image_id", rec["image_id"]); out("modules", " ".join(mods) or "(none)")
          PY

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - name: Configure SSH
        run: |
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > .prod_key && chmod 600 .prod_key

      # Values reach the remote shell as %q-quoted assignments on stdin, never on
      # the ssh command line (see deploy-staging.yml for why).
      - name: Promote
        id: promote
        env:
          SHA: ${{ inputs.sha }}
          DBS: ${{ inputs.upgrade_databases }}
          I18N: ${{ inputs.i18n_overwrite }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_IMAGE_ID: ${{ needs.gate.outputs.expected_image_id }}
          MODULES: ${{ needs.gate.outputs.modules }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          SERVICE: ${{ inputs.service_name }}
          SRC: ${{ inputs.odoo_source_path }}
          BACKUP: ${{ inputs.backup_script }}
          HTTP_PORT: ${{ inputs.http_port }}
        run: |
          {
            for v in SHA DBS I18N DRY_RUN EXPECTED_IMAGE_ID MODULES PROJECT_DIR SERVICE SRC BACKUP HTTP_PORT; do
              printf '%s=%q\n' "$v" "${!v}"
            done
            cat <<'REMOTE'
          set -euo pipefail
          # 1. One lock per host, shared with backup.sh, restore.sh and the container play.
          LOCKFILE=/odoo/host.lock
          [ -e "$LOCKFILE" ] || sudo -n install -m 0644 -o root -g root /dev/null "$LOCKFILE"
          exec 200<"$LOCKFILE"
          flock -w 1800 200 || { echo "host lock held for 30 minutes; giving up" >&2; exit 1; }

          # 2. Under the lock: the image the rehearsal ran under is the one running,
          #    and the candidate is fetchable. Fetching changes nothing checked out.
          image_id=$(docker inspect --format '{{.Image}}' "$SERVICE")
          [ "$image_id" = "$EXPECTED_IMAGE_ID" ] || { echo "production runs image $image_id, the rehearsal ran under $EXPECTED_IMAGE_ID: promote the image first" >&2; exit 1; }
          sudo -n -u odoo git -C "$PROJECT_DIR" fetch -q origin "$SHA"
          current=$(sudo -n -u odoo git -C "$PROJECT_DIR" rev-parse HEAD)
          echo "== production at $current, promoting $SHA"

          # 3. Pre-update backup, inside our lock (the script would otherwise wait on itself).
          echo "== backup"
          sudo -n env ODOO_HOST_LOCK_HELD=1 "$BACKUP"

          # 4. Preview: what the rehearsal upgraded, and the module directories the diff touches.
          echo "== modules the rehearsal upgraded: $MODULES"
          echo "== module directories changed:"
          sudo -n -u odoo git -C "$PROJECT_DIR" diff --name-only "$current" "$SHA" | awk -F/ 'NF>2 {print $1"/"$2}' | sort -u
          if [ "$DRY_RUN" = true ]; then echo "== dry run: stopping before any change"; exit 0; fi

          # 5. Stop, then reset: the tree is bind-mounted, so a live reset serves a half-updated tree.
          echo "== stop and reset"
          docker stop "$SERVICE"
          sudo -n -u odoo git -C "$PROJECT_DIR" reset -q --hard "$SHA"

          # 6. Upgrade every database in a one-off container from the same image and
          #    volumes, with the service still stopped, so no request meets new code
          #    on an old schema.
          args=(--ignore-core-addons --watcher-max-seconds 30 --logfile=/dev/stdout)
          [ "$I18N" = true ] && args+=(--i18n-overwrite)
          for db in $DBS; do
            echo "== upgrading $db"
            docker run --rm --volumes-from "$SERVICE" -e PYTHONPATH="$SRC" -u odoo "$image_id" \
              click-odoo-update -c /odoo/etc/odoo.conf -d "$db" "${args[@]}"
          done

          # 7. Start and wait for Odoo to listen (the odoo_container role's check).
          docker start "$SERVICE"
          for i in $(seq 1 90); do
            (exec 3<>"/dev/tcp/127.0.0.1/$HTTP_PORT") 2>/dev/null && break
            [ "$i" -eq 90 ] && { echo "Odoo did not listen on $HTTP_PORT within 180s" >&2; exit 1; }
            sleep 2
          done

          # 8. Deploy record, on the host and (via the runner) as a tag. The timestamp
          #    is this host's clock in backup.sh's format, so the gate can compare it
          #    with backup names.
          ts=$(date +%Y_%m_%d_%H_%M_%S)
          record=$(printf '{"sha":"%s","image":"%s","image_id":"%s","databases":"%s","timestamp":"%s"}' \
            "$SHA" "$(docker inspect --format '{{.Config.Image}}' "$SERVICE")" "$image_id" "$DBS" "$ts")
          printf '%s\n' "$record" | sudo -n tee /odoo/last_deploy.json >/dev/null
          echo "DEPLOY_RECORD=$record"
          echo "== deployed $SHA"
          REMOTE
          } | ssh -i .prod_key -p "${{ inputs.production_port }}" -o StrictHostKeyChecking=accept-new \
                "${{ inputs.production_user }}@${{ inputs.production_host }}" bash -s | tee deploy.log
          grep -o '^DEPLOY_RECORD=.*' deploy.log | sed 's/^DEPLOY_RECORD=/record=/' >> "$GITHUB_OUTPUT" || true

      - name: Tag the deploy
        if: steps.promote.outputs.record != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ steps.promote.outputs.record }}
        run: |
          ts=$(python3 -c 'import json,os;print(json.loads(os.environ["RECORD"])["timestamp"])')
          tag="prod/${{ inputs.host_name }}/$ts"
          obj=$(gh api "repos/${{ github.repository }}/git/tags" -f tag="$tag" -f message="$RECORD" -f object="${{ inputs.sha }}" -f type=commit --jq .sha)
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$obj" >/dev/null
          { echo "## Promoted to ${{ inputs.host_name }}"; echo; echo "- commit \`${{ inputs.sha }}\`"; echo "- databases \`${{ inputs.upgrade_databases }}\`"; echo "- modules the rehearsal upgraded: ${{ needs.gate.outputs.modules }}"; echo "- tag \`$tag\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: inputs.dry_run
        run: |
          { echo "## Dry run against ${{ inputs.host_name }}"; echo; echo "Gate passed for \`${{ inputs.sha }}\` (rollback: ${{ needs.gate.outputs.rollback }}). Backup taken, preview printed, nothing changed."; echo; echo '```'; sed -n '/^== modules/,/^== dry run/p' deploy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f .prod_key
